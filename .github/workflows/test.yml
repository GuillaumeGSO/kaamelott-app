name: Tests

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # infra/ is its own package; it's typechecked with the app's TypeScript 7.
      # No cdk synth here: it looks the API up in AWS, so it needs credentials.
      - run: npm ci
        working-directory: infra

      - run: ./node_modules/.bin/tsc -p infra
