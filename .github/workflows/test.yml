name: Tests

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Pact contract with kaamelott-lambda: regenerate it and fail if the committed copy differs,
      # since kaamelott-lambda verifies the committed file (see README, Contract tests).
      - run: npm run pact:publish

      - name: Contract committed and up to date
        run: |
          # status (not diff) so a contract that was never committed fails too
          if [ -n "$(git status --porcelain pacts/)" ]; then
            git status --short pacts/
            echo "::error::pacts/ is out of date: run npm run pact:publish and commit it"
            exit 1
          fi

      - run: npm run build

      # infra/ is its own package; it's typechecked with the app's TypeScript 7.
      # No cdk synth here: it looks the API up in AWS, so it needs credentials.
      - run: npm ci
        working-directory: infra

      - run: ./node_modules/.bin/tsc -p infra
