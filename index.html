<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1712" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Citations de Kaamelott au hasard, par personnage ou parmi tes favoris." />
    <title>Citations Kaamelott</title>
    <script>
      // Apply a forced day/night choice before the first paint (see src/theme.ts).
      try {
        var theme = localStorage.getItem('kaamelott.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
